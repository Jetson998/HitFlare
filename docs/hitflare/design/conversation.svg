<rect x="430" y="112" width="180" height="32" rx="16" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="520.0" y="132.0" font-family="PingFang SC, Hiragino Sans GB, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#111827" text-anchor="middle">标题胶囊</text>
<rect x="430" y="112" width="180" height="32" rx="16" fill="none" stroke="#E6E8EE" stroke-width="1"/>
