<rect x="836" y="560" width="36" height="36" rx="18" fill="#FFFFFF" stroke="#E6E8EE" stroke-width="1"/>
<rect x="880" y="560" width="220" height="36" rx="18" fill="#FFFFFF" stroke="#E6E8EE" stroke-width="1"/>
<rect x="1110" y="560" width="64" height="36" rx="18" fill="#111827" stroke="none" stroke-width="0"/>
<text x="1142.0" y="582.0" font-family="PingFang SC, Hiragino Sans GB, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">发送</text>
<text x="836" y="548" font-family="PingFang SC, Hiragino Sans GB, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#9F1239" text-anchor="start">参数只留图标，和输入、发送同一行</text>
<text x="28" y="700" font-family="PingFang SC, Hiragino Sans GB, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#9F1239" text-anchor="start">窄屏标题居中截断，不压住返回和分享。宽屏胶囊最长约 16rem。</text>
<text x="28" y="722" font-family="PingFang SC, Hiragino Sans GB, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#9F1239" text-anchor="start">参数图标切换用创作区自己的 640px 容器，不是新的全局断点。</text>
<text x="28" y="744" font-family="PingFang SC, Hiragino Sans GB, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#9F1239" text-anchor="start">头像以后用 Studio 的云朵、兴奋、蓝色一张。图里的蓝圆只是占位，不是正式素材。</text>
</svg>
