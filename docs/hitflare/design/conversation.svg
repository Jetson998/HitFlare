<text x="376" y="272" font-family="PingFang SC, Hiragino Sans GB, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">气泡占位，结构不重画</text>
<rect x="250" y="560" width="500" height="72" rx="20" fill="#FFFFFF" stroke="#E6E8EE" stroke-width="1"/>
