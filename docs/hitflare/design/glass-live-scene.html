<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; form-action 'none'">
  <title>HitFlare · 现网底稿材质评审</title>
  <link rel="stylesheet" href="live-audit/source-ui.css">
  <style id="runtime-styles"></style>
  <style>
    html,body{margin:0;min-height:100%;height:100%}
    :root{--review-glass:rgba(255,255,255,.22);--review-panel:rgba(255,255,255,.58);--review-edge:rgba(255,255,255,.55);--review-text:#111827;--review-shadow:none;--review-panel-shadow:none}
    html.dark{--review-glass:rgba(18,20,24,.34);--review-panel:rgba(20,22,26,.62);--review-edge:rgba(255,255,255,.18);--review-text:#f5f5f4;--review-shadow:none;--review-panel-shadow:none}
    html[data-material=glass] [data-material-surface=tool]{background:var(--review-glass)!important;color:var(--review-text)!important;border:0!important;box-shadow:none!important;backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7)}
    html[data-material=glass] button[aria-label="添加参考图"]{background:#fff!important;color:#111827!important;border:1px solid #E6E8EE!important;border-radius:12px!important;box-shadow:0 1px 2px rgba(16,24,40,.06)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}html[data-material=glass] button[aria-label="添加参考图"]:hover{background:#F7F8FA!important}html.dark[data-material=glass] button[aria-label="添加参考图"]{background:#0c0a09!important;color:#f5f5f4!important;border-color:#44403c!important;box-shadow:none!important}html.dark[data-material=glass] button[aria-label="添加参考图"]:hover{background:#1c1917!important}
    html[data-material=glass] [data-material-surface=tool]:hover,html[data-material=glass] [data-state=hover][data-material-surface=tool]{background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.08) 42%),rgba(255,255,255,.34)!important}
    html[data-material=glass] [data-material-surface=tool]:active,html[data-material=glass] [data-state=pressed][data-material-surface=tool]{background:rgba(255,255,255,.5)!important;box-shadow:none!important}
    html[data-material=glass] [data-material-surface=panel],html[data-material=glass] .ant-modal-container{background:var(--review-panel)!important;box-shadow:none!important;border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(48px) saturate(1.45);-webkit-backdrop-filter:blur(48px) saturate(1.45)}
    html[data-material=glass] .ant-modal-header,html[data-material=glass] .ant-modal-body{background:transparent!important}
    html[data-material=glass] .ant-modal-container input,html[data-material=glass] .ant-modal-container textarea,html[data-material=glass] .ant-modal-container .ant-select-selector,html[data-material=glass] .ant-input,html[data-material=glass] .ant-input-affix-wrapper{background:#fff!important;color:#111827!important;opacity:1!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
    html.dark[data-material=glass] .ant-modal-container input,html.dark[data-material=glass] .ant-modal-container textarea,html.dark[data-material=glass] .ant-modal-container .ant-select-selector,html.dark[data-material=glass] .ant-input,html.dark[data-material=glass] .ant-input-affix-wrapper{background:#1c1e21!important;color:#f5f5f4!important}
    html[data-material=glass] .ant-modal-mask{background:rgba(18,22,28,.16)!important;backdrop-filter:none!important}
    html.dark[data-material=glass] .ant-modal-mask{background:rgba(0,0,0,.28)!important}
    html[data-material=glass] [data-preview-kind=light]{background:rgba(255,255,255,.14)!important;color:#111827!important;backdrop-filter:blur(40px) saturate(1.45);-webkit-backdrop-filter:blur(40px) saturate(1.45)}
    html.dark[data-material=glass] [data-preview-kind=light]{background:rgba(10,12,16,.24)!important;color:#f5f5f4!important}
    html[data-material=glass] [data-preview-kind=heavy]{background:rgba(8,9,11,.90)!important;backdrop-filter:none!important}
    html[data-material=glass] [data-preview-kind=heavy] [data-material-surface=tool]{--review-glass:rgba(255,255,255,.14);--review-text:#fff;color:#fff!important;box-shadow:none!important}
    html[data-material=glass] [data-material-surface=image-action]{background:rgba(17,19,24,.38)!important;color:#fff!important;box-shadow:none!important;backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
    html[data-material=glass] [data-material-surface=primary]:not(:disabled),[data-state=selected][data-material-surface=segment]{background:#111827!important;border-color:#111827!important;color:#fff!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
    html.dark[data-material=glass] [data-material-surface=primary]:not(:disabled){background:#f5f5f4!important;border-color:#f5f5f4!important;color:#111827!important}html[data-material=glass] [data-state=hover][data-material-surface=primary]{background:#000!important}html[data-material=glass] [data-state=pressed][data-material-surface=primary]{background:#000!important;box-shadow:none!important}html[data-material=glass] [data-state=selected][data-material-surface=tool]{background:#111827!important;color:#fff!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
    html[data-material=glass] [data-state=disabled],html[data-material=glass] [data-material-surface=tool]:disabled,html[data-material=glass] [data-material-surface=primary]:disabled{opacity:1!important;color:#98A2B3!important;background:#F3F4F6!important;border-color:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
    html[data-material=glass] [data-state=focus],html[data-material=glass] [data-material-surface]:focus-visible{outline:2px solid #111827;outline-offset:3px}
    html.dark[data-material=glass] [data-state=focus],html.dark[data-material=glass] [data-material-surface]:focus-visible{outline-color:#f5f5f4}
    .review-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9000;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:#111827;color:white;font:13px/20px -apple-system,"PingFang SC",sans-serif;box-shadow:none}
    .study{min-height:100dvh;display:grid;place-content:center;gap:18px;background:#f4f4f4;padding:24px;font:13px/22px -apple-system,"PingFang SC",sans-serif;color:#303237}.study img{max-width:100%;max-height:75dvh;object-fit:contain}.study p{margin:0;text-align:center}
    .specimen{width:100%;max-width:100vw;min-height:100%;box-sizing:border-box;overflow-x:hidden;background:#f6f6f5;color:#111827;font:13px/20px -apple-system,"PingFang SC",sans-serif}
    html.dark .specimen{background:#151618;color:#f5f5f4}
    .specimen-note{margin:0;box-sizing:border-box;max-width:100%;padding:16px 16px 8px;color:#5B6475;white-space:normal;overflow-wrap:anywhere}
    html.dark .specimen-note{color:#B5B8C0}
    .field{position:relative;width:calc(100% - 32px);max-width:calc(100vw - 32px);margin:12px 16px 20px;min-height:560px;overflow:hidden;border-radius:16px}
    .field img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .field-copy,.row{width:100%;max-width:100%;min-width:0}.field-copy{position:relative;z-index:1;display:grid;gap:18px;padding:22px;box-sizing:border-box}
    .row{display:flex;flex-wrap:wrap;gap:12px 14px}
    .state{display:grid;justify-items:center;gap:6px;width:74px}
    .state b{font-weight:400;font-size:11px;line-height:16px;color:#111827;background:rgba(255,255,255,.86);border-radius:999px;padding:1px 7px}
    html.dark .state b{color:#f5f5f4;background:rgba(20,22,26,.78)}
    .ctrl{display:grid;place-items:center;border:0;padding:0;font:inherit}
    .ctrl-tool{width:32px;height:32px;border-radius:999px;background:#fff;color:#6B7280;box-shadow:none;border:1px solid rgba(17,24,39,.08)}
    .ctrl-tool.lg{width:40px;height:40px}
    .ctrl-primary{height:40px;min-width:72px;padding:0 14px;border-radius:999px;background:#111827;color:#fff;font-weight:500}
    .ctrl-seg{height:32px;padding:0 12px;border-radius:999px;background:#F3F4F6;color:#6B7280}
    .ctrl-input{height:40px;width:min(220px,100%);border:1px solid #E6E8EE;border-radius:999px;background:#fff;color:#111827;padding:0 14px}
    .ctrl-panel{width:min(280px,100%);border-radius:16px;background:#fff;color:#111827;padding:14px;box-shadow:none;border:1px solid rgba(17,24,39,.08);text-align:left}
    .ctrl-panel strong{display:block;font-size:16px;line-height:24px;margin-bottom:8px}
    .ctrl-panel p{margin:8px 0 0;color:#6B7280}
    .feedback{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 16px 28px}
    .feedback article{min-height:92px;border-radius:12px;background:#fff;padding:12px;color:#111827;box-shadow:none;border:1px solid rgba(17,24,39,.08)}
    html.dark .feedback article{background:#1c1e21;color:#f5f5f4}
    .feedback h2{margin:0 0 6px;font-size:12px;line-height:18px;font-weight:500;color:#6B7280}
    .feedback p{margin:0}
    .err{color:#B42318}
    .spin{width:14px;height:14px;border-radius:999px;border:2px solid currentColor;border-right-color:transparent}
    html:not([data-material=glass]) [data-state=hover].ctrl-tool{background:#F3F4F6}
    html:not([data-material=glass]) [data-state=pressed].ctrl-tool{background:#E5E7EB}
    html:not([data-material=glass]) [data-state=disabled]{color:#98A2B3!important;background:#F3F4F6!important;box-shadow:none!important;opacity:1}
    html:not([data-material=glass]) [data-state=focus]{outline:2px solid #111827;outline-offset:3px}
    @media(max-width:520px){.field{min-height:760px}.feedback{grid-template-columns:1fr 1fr}}
    @media(prefers-reduced-transparency:reduce){html[data-material=glass] [data-material-surface=tool],html[data-material=glass] [data-material-surface=panel],html[data-material=glass] .ant-modal-container{background:#fff!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}html.dark[data-material=glass] [data-material-surface=tool],html.dark[data-material=glass] [data-material-surface=panel],html.dark[data-material=glass] .ant-modal-container,html[data-material=glass] [data-preview-kind=heavy] [data-material-surface=tool]{background:#22252b!important;color:#f5f5f4!important}}
</style>
</head>
<body>
<script>
  const query=new URLSearchParams(location.search);
  let scene=query.get('scene')||'workbench-empty';
  const theme=query.get('theme')||'light',material=query.get('material')||'glass';
  let sceneTrail=({picker:['workbench'],light:['workbench','picker'],settings:['workbench'],heavy:['results'],'reference-menu':['workbench-empty'],'asset-detail':['library'],'library-light':['library']})[scene]||[],previewTransform={zoom:1,rotation:0,x:1,y:1},toastTimer;
  const narrow=()=>matchMedia('(max-width:767px)').matches;
  function label(el){return el?.getAttribute('aria-label')||el?.getAttribute('title')||el?.textContent?.trim()||'';}
  function toast(message='设计底稿：此操作不连接业务服务'){document.querySelector('.review-toast')?.remove();const node=document.createElement('div');node.className='review-toast';node.textContent=message;node.role='status';document.body.append(node);clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.remove(),2200);}
  function openScene(next,replace=false,source){if(!replace)sceneTrail.push(scene);render(next,source);}
  function closeScene(){render(sceneTrail.pop()||'workbench');}
  function markMaterials(){
    document.querySelectorAll('button').forEach(button=>{
      const name=label(button);
      if(['搜索记录','新建生成','生成记录','返回创作','打开菜单','移除参考图','Remove reference image'].includes(name))button.dataset.materialSurface='tool';
      if(['开始生成','重新生成'].includes(name))button.dataset.materialSurface='primary';
      if(name==='添加')button.dataset.materialSurface='image-action';
    });
    document.querySelectorAll('div.fixed').forEach(el=>{if(el.querySelector('button')&&el.textContent.includes('上传参考图')&&el.textContent.includes('剪切板')&&el.childElementCount===3)el.dataset.materialSurface='panel';});
    document.querySelectorAll('[role=dialog][aria-label="图片预览"]').forEach(preview=>{
      preview.dataset.previewKind=preview.querySelector('[aria-label="存入资产"]')?'heavy':'light';
      preview.querySelectorAll('button').forEach(button=>{if(!/^查看第/.test(label(button))&&!['上下翻转','左右翻转','向左旋转','向右旋转','缩小','放大'].includes(label(button)))button.dataset.materialSurface='tool';});
      const tools=preview.querySelector('[aria-label="上下翻转"]')?.parentElement;
      if(tools)tools.dataset.materialSurface='tool';
    });
  }
  async function render(next=scene,previewSource){
    scene=next;document.documentElement.dataset.ready='false';document.documentElement.dataset.scene=scene;
    previewTransform={zoom:1,rotation:0,x:1,y:1};
    if(scene==='typed-picker'){renderTypedPicker();return;}
    if(scene==='states'){renderStates();return;}
    if(scene==='specimen'){
      document.body.className='';document.body.style='';document.body.innerHTML='<main class="study"><img src="glass-material-comparison.png" alt="左为原材质模拟，右为玻璃候选"><p>仅用于比较材质，非产品页面；不用于控件、字段或布局验收。</p></main>';
      document.documentElement.dataset.ready='true';return;
    }
    let key=scene+'-'+(narrow()?'narrow':'wide')+(theme==='dark'?'-dark':'');
    if(scene==='asset-detail'&&narrow())key='asset-detail-wide';
    const response=await fetch('live-audit/snapshots/'+key+'.json');
    if(!response.ok){document.body.textContent='该状态尚未核对，请使用已列出的场景。';return;}
    const snapshot=await response.json();
    document.documentElement.className=snapshot.htmlClass;
    document.documentElement.classList.toggle('dark',theme==='dark');
    document.documentElement.dataset.material=material;
    document.body.className=snapshot.bodyClass;document.body.setAttribute('style',snapshot.bodyStyle);
    document.getElementById('runtime-styles').textContent=snapshot.styles;
    document.body.innerHTML=snapshot.html;
    document.querySelectorAll('script').forEach(n=>n.remove());
    document.querySelectorAll('input,textarea').forEach(n=>n.readOnly=true);
    document.querySelectorAll('[class*="ant-zoom"],[class*="ant-fade"]').forEach(n=>{n.className=n.className.split(' ').filter(c=>!c.startsWith('ant-zoom')&&!c.startsWith('ant-fade')).join(' ');});
    const previewImage=document.querySelector('[role=dialog][aria-label="图片预览"] img:not(button img)');
    if(previewSource&&previewImage)previewImage.src=previewSource;
    if(scene==='library-light'&&material==='glass')document.querySelectorAll('[role=dialog][aria-label="图片预览"] button[aria-label="收藏"],[role=dialog][aria-label="图片预览"] button[aria-label="下载图片"],[role=dialog][aria-label="图片预览"] button[aria-label="存入资产"]').forEach(n=>n.remove());
    markMaterials();document.documentElement.dataset.ready='true';
  }


  function renderTypedPicker(){
    document.documentElement.className='';
    document.documentElement.classList.toggle('dark', theme==='dark');
    document.documentElement.dataset.material=material;
    document.body.className='bg-background text-foreground antialiased';
    document.body.setAttribute('style','');
    document.getElementById('runtime-styles').textContent='';
    const photo='../../../web/public/home/inspirations/photo-solver-v1.png';
    const kinds=[['all','全部',true],['text','文本',false],['image','图片',false],['video','视频',false],['audio','音频',false]];
    const pills=kinds.map(([key,label,on])=>`<button type="button" class="rounded-full px-3 py-1 text-[13px] leading-5 ${on?'bg-white font-medium text-[#111827] shadow-[0_1px_2px_rgba(16,24,40,.06)]':'text-[#6B7280]'}">${label}</button>`).join('');
    const card=(n)=>`<button type="button" class="group relative cursor-pointer overflow-hidden rounded-2xl border border-[#E6E8EE] bg-white text-left"><img src="${photo}" alt="" class="aspect-[4/3] w-full object-cover"><div class="p-2.5"><div class="flex items-center justify-between gap-2"><span class="line-clamp-1 text-[13px] font-medium leading-5 text-[#111827]">素材 ${n}</span><span class="shrink-0 rounded-full bg-[#F3F4F6] px-2 py-0.5 text-xs leading-4 text-[#6B7280]">图片</span></div></div></button>`;
    document.body.innerHTML=`<div class="grid min-h-dvh place-items-center bg-[#F7F8FA] p-3"><p style="position:fixed;top:8px;left:12px;right:12px;margin:0;color:#9a3412;font:12px/18px -apple-system,PingFang SC,sans-serif">按类型选资产没有单独的线上截图。基线照搬当前弹窗：860 宽、搜索、全部/文本/图片/视频/音频、四列、每页 8 项。窄屏不改宽度。</p><section class="ant-modal-container w-[860px] max-w-none rounded-lg bg-white p-5" style="margin-top:28px"><h2 class="m-0 text-base font-medium leading-6 text-[#111827]">选择资产</h2><div class="mt-2 flex h-[520px] flex-col gap-4"><div class="flex items-center gap-3"><div class="flex h-10 min-w-0 flex-1 items-center gap-2 rounded-full border border-[#E6E8EE] px-4 text-sm text-[#6B7280]">搜索资产</div><div class="flex shrink-0 items-center gap-1 rounded-full bg-[#F3F4F6] p-1">${pills}</div></div><div class="grid min-h-0 flex-1 grid-cols-4 content-start gap-3">${[1,2,3,4,5,6,7,8].map(card).join('')}</div><div class="flex h-8 items-center justify-center text-[13px] text-[#6B7280]">1 / 2</div></div></section></div>`;
    document.documentElement.dataset.ready='true';
  }
  function statesMarkup(){
    const plus='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
    const loader='<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" opacity=".28"/><path d="M8 2a6 6 0 0 1 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    const labels={"":"默认",hover:"悬停",pressed:"按下",focus:"焦点",disabled:"禁用",loading:"加载",selected:"选中"};
    const cell=(cls,surface,key,inner)=>`<div class="state"><button type="button" class="ctrl ${cls}" data-material-surface="${surface}" data-review-static ${key?`data-state="${key}"`:''} ${key==='disabled'?'disabled':''}>${key==='loading'?loader:(surface==='segment'&&key==='selected'?'1:1':inner)}</button><b>${labels[key]}</b></div>`;
    const row=(title,cls,surface,keys,inner)=>`<div class="row" aria-label="${title}">${keys.map(key=>cell(cls,surface,key,inner)).join('')}</div>`;
    const common=['','hover','pressed','focus','disabled','loading'];
    return `<main class="specimen"><p class="specimen-note">控件状态，不是产品页面。<br>玻璃透图片颜色。生成按钮和输入框保持实色。</p><section class="field"><img src="../../../web/public/brand/hitflare-login-background.jpg" alt=""><div class="field-copy">${row('32 圆按钮','ctrl-tool','tool',common,plus)}${row('40 预览圆按钮','ctrl-tool lg','tool',[...common,'selected'],plus)}${row('40 生成按钮','ctrl-primary','primary',common,'生成')}${row('分段','ctrl-seg','segment',['','hover','pressed','focus','disabled','selected'],'自动')}<div class="ctrl-panel" data-material-surface="panel"><strong>模型参数</strong><input class="ctrl-input" value="提示词保持实色" readonly><p>窗体透出背后的光，字段本身不透。</p></div></div></section><section class="feedback"><article><h2>空</h2><p>还没有生成图片</p></article><article><h2>加载</h2><p>正在生成</p></article><article><h2>错误</h2><p class="err">生成失败，可重试</p></article><article><h2>成功</h2><p>已加入我的资产</p></article></section></main>`;
  }
  function renderStates(){
    document.documentElement.className=theme==='dark'?'dark':'';
    document.documentElement.classList.toggle('dark',theme==='dark');
    document.documentElement.dataset.material=material;
    document.body.className='';document.body.removeAttribute('style');
    document.getElementById('runtime-styles').textContent='';
    document.body.innerHTML=statesMarkup();
    document.documentElement.dataset.ready='true';
  }
  function transform(action){
    const preview=document.querySelector('[role=dialog][aria-label="图片预览"]');
    const picture=preview?.querySelector('img:not(button img)');if(!picture)return;
    if(action==='上下翻转')previewTransform.y*=-1;
    if(action==='左右翻转')previewTransform.x*=-1;
    if(action==='向左旋转')previewTransform.rotation-=90;
    if(action==='向右旋转')previewTransform.rotation+=90;
    if(action==='放大')previewTransform.zoom=Math.min(3,previewTransform.zoom+.25);
    if(action==='缩小')previewTransform.zoom=Math.max(.5,previewTransform.zoom-.25);
    picture.style.transform=`rotate(${previewTransform.rotation}deg) scale(${previewTransform.zoom*previewTransform.x},${previewTransform.zoom*previewTransform.y})`;
  }
  document.addEventListener('click',event=>{
    const node=event.target.closest('button,a,[role=radio]');
    if(!node)return;event.preventDefault();
    if(node.hasAttribute('data-review-static'))return;
    const name=label(node),href=node.dataset.originalHref;
    if(href){if(href==='/assets'||href==='/image'){sceneTrail=[];render(href==='/assets'?'library':'workbench-empty');}else toast();return;}
    if(name==='添加参考图'||name==='上传参考图，对齐主体、构图或风格'){openScene('reference-menu');return;}
    if(name==='我的资产'){openScene('picker',scene==='reference-menu');return;}
    if(name.startsWith('生成设置：')){openScene('settings');return;}
    if(name.startsWith('预览 ')){openScene('light',false,node.querySelector('img')?.src);return;}
    if(name==='查看大图'){openScene(scene==='asset-detail'?'library-light':'heavy',false,node.querySelector('img')?.src);return;}
    if(name==='关闭'||name==='Close'){closeScene();return;}
    if(['上下翻转','左右翻转','向左旋转','向右旋转','缩小','放大'].includes(name)){transform(name);return;}
    if(/^查看第/.test(name)||name==='上一张'||name==='下一张'){
      const preview=node.closest('[role=dialog]'),thumbs=[...preview.querySelectorAll('button[aria-label^="查看第"]')];
      let index=thumbs.indexOf(node);if(index<0){const old=thumbs.findIndex(b=>b.getAttribute('aria-current')==='true');index=(old+(name==='下一张'?1:-1)+thumbs.length)%thumbs.length;}
      const picture=preview.querySelector('img:not(button img)'),source=thumbs[index]?.querySelector('img');
      if(picture&&source){picture.src=source.src;picture.alt=`生成结果 ${index+1}`;picture.style.transform='';previewTransform={zoom:1,rotation:0,x:1,y:1};thumbs.forEach((b,i)=>{const selected=i===index;b.setAttribute('aria-current',selected);['ring-2','ring-white'].forEach(c=>b.classList.toggle(c,selected));['opacity-60','hover:opacity-100'].forEach(c=>b.classList.toggle(c,!selected));});const counter=[...preview.querySelectorAll('div,span')].find(n=>n.childElementCount===0&&/^\d+ \/ \d+$/.test(n.textContent));if(counter)counter.textContent=`${index+1} / ${thumbs.length}`;}return;
    }
    if(scene==='library'&&node.querySelector('img')){if(theme==='dark')toast('该深色详情状态尚未核对，请使用上方已列出的预览场景');else openScene(narrow()?'library-light':'asset-detail');return;}
    toast();
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&sceneTrail.length){event.preventDefault();closeScene();}});
  render();
</script>
</body>
</html>
