const pics=[{src:PUBLIC+'home/creative-workspace.png',title:'红山茶花 · 美妆海报',position:'center'},{src:PUBLIC+'brand/hitflare-login-background-clean.png',title:'光引 · 空间光影',position:'35% center'},{src:PUBLIC+'home/inspirations/photo-solver-v1.png',title:'拍照解题 · 内容示例',position:'center'},{src:PUBLIC+'templates/tpl_bg-v1.svg',title:'商品背景 · 模板',position:'center'},{src:PUBLIC+'templates/tpl_model-v1.svg',title:'真人试穿 · 模板',position:'center'},{src:PUBLIC+'templates/tpl_poster-v1.svg',title:'营销封面 · 模板',position:'center'}];
const paths={image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.4"/><path d="m21 15-6-6L3 21"/>',video:'<rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 10 5-3v10l-5-3"/>',spark:'<path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4Z"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',bot:'<rect x="3" y="7" width="18" height="13" rx="4"/><path d="M12 7V3m-4 10v2m8-2v2"/>',folder:'<path d="M3 8V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',down:'<path d="m6 9 6 6 6-6"/>',back:'<path d="m14 5-7 7 7 7"/>',next:'<path d="m10 5 7 7-7 7"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',sliders:'<path d="M4 7h7m6 0h3M4 17h3m6 0h7"/><circle cx="14" cy="7" r="3"/><circle cx="10" cy="17" r="3"/>',rotate:'<path d="M3 10a9 9 0 1 1 1 8M3 4v6h6"/>',flip:'<path d="M12 3v2m0 3v2m0 4v2m0 3v2M3 7l5 5-5 5Zm18 0-5 5 5 5Z"/>',minus:'<path d="M5 12h14"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',check:'<path d="m5 12 4 4L19 6"/>',gear:'<path d="m9 3 1 3h4l1-3 3 2-2 3 2 3 3-1v4l-3-1-2 3 2 3-3 2-1-3h-4l-1 3-3-2 2-3-2-3-3 1v-4l3 1 2-3-2-3Z"/><circle cx="12" cy="12" r="3"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.spark}</svg>`;
const btn=(n,label,action='',cls='circle glass')=>`<button type="button" class="${cls}" aria-label="${label}" title="${label}" ${action?`data-action="${action}"`:''}>${icon(n)}</button>`;
const picture=(p,cls='')=>`<img class="${cls}" src="${p.src}" alt="${p.title}" style="object-position:${p.position}" draggable="false">`;
let currentScene=q.get('scene')||'picker',overlay=['settings','picker','light','heavy'].includes(currentScene)?currentScene:null,base=currentScene==='library'||currentScene==='light'?'library':'workbench',imageIndex=currentScene==='light'?1:0,historyOpen=false,menuOpen=false,pickerParent=false,zoom=1,rotation=0,flip=1;
let previewIndexes=currentScene==='heavy'?[0,1]:pics.map((_,i)=>i);
const root=document.querySelector('#root');
function segments(labels){return `<div class="segments">${labels.map((l,i)=>`<button data-select aria-pressed="${i===0}">${l}</button>`).join('')}</div>`}
function historyItems(){return pics.slice(0,3).map((p,i)=>`<button class="history-item ${i===0?'active':''}" data-action="history-close">${picture(p)}<span>${p.title}<span class="meta">${i===0?'3 张图片 · 已完成':'1 张图片 · 已完成'}</span></span></button>`).join('')}
function sidebar(){return `<aside class="sidebar"><img class="brand-light" src="${PUBLIC}brand/hitflare-logo-sidebar-light.png" alt="HitFlare"><img class="brand-dark" src="${PUBLIC}brand/hitflare-logo-sidebar-dark.png" alt="HitFlare"><button class="nav-item" data-action="home">${icon('grid')}首页</button><div class="nav-caption">创作</div>${[['image','图片创作','workbench'],['video','视频创作','sample'],['bot','Agent 创作','sample'],['spark','创作灵感','sample'],['image','爆款复刻','sample']].map(([i,t,a])=>`<button class="nav-item ${a===base?'active':''}" data-action="${a}">${icon(i)}${t}</button>`).join('')}<div class="nav-caption">内容</div><button class="nav-item ${base==='library'?'active':''}" data-action="library">${icon('folder')}内容库</button><button class="nav-item" data-action="sample">${icon('grid')}我的画布</button><div class="user row"><span class="avatar">设计</span><span>设计示例</span>${btn('more','账户菜单','menu','circle')}</div></aside>`}
function topbar(){return `<header class="topbar"><span class="mobile-logo"><img class="brand-light" src="${PUBLIC}brand/hitflare-logo-horizontal-en-glass.png" alt="HitFlare"><img class="brand-dark" src="${PUBLIC}brand/hitflare-logo-sidebar-dark.png" alt="HitFlare"></span><div class="mobile-current"><button class="pill glass" data-action="menu">${base==='library'?'内容库':'图片创作'}${icon('down')}</button></div></header>`}
function results(){return pics.slice(0,2).map((p,i)=>`<article class="result"><div class="result-head"><span>生成结果 ${i+1}</span><span>已完成</span></div><button class="result-image" data-image="${i}" data-action="heavy">${picture(p)}</button><div class="result-footer"><div class="toolbar glass">${btn('star','收藏','favorite','circle')}${btn('download','下载','sample','circle')}<span class="toolbar-sep"></span><button data-action="sample">${icon('folder')}存入资产</button><button data-action="sample">${icon('copy')}复用</button></div></div></article>`).join('')}
function workbench(){return `<section class="workspace"><div class="workbench"><aside class="history"><div class="history-tools">${btn('search','搜索记录','sample')}${btn('plus','新建创作','sample')}</div><div><p class="history-date">2026年10月31日</p>${historyItems()}</div></aside><div class="wb-body"><header class="wb-head">${btn('back','生成记录','history','circle back glass narrow-back')}${segments(['图片生成','场景模板'])}</header><div class="creation"><section class="settings-col"><div class="stack"><div><label class="label" for="prompt">提示词</label><textarea id="prompt" class="field">一张红山茶花主题的美妆海报，保留产品质感与自然肤色。画面干净，柔和侧光，细节清晰。</textarea></div><div><span class="label">参考图</span><div class="reference-area"><button class="add-tile" data-action="picker" aria-label="选择参考图">${icon('plus')}</button><div class="ref-tile"><button style="padding:0" data-action="light" data-image="0">${picture(pics[0])}</button>${btn('close','移除参考图','sample','remove-ref')}</div></div></div><div><span class="label">生成设置</span><button class="pill glass settings-summary" data-action="settings">${icon('sliders')}<span>图像模型 · 自动 · 1:1 · 1 张</span>${icon('down')}</button></div><button class="action" data-action="sample">${icon('spark')}生成图片</button></div></section><section class="results">${results()}</section></div></div>${historyOpen?`<section class="history-screen"><div class="history-tools">${btn('back','返回创作','history-close','circle back glass')}${btn('search','搜索记录','sample')}${btn('plus','新建创作','sample')}</div><p class="history-date">2026年10月31日</p>${historyItems()}</section>`:''}</div></section>`}
function library(){return `<section class="library"><div class="library-inner"><div class="library-heading"><div class="row"><h1>内容库</h1><span class="small muted lib-count">6 项</span></div><button class="primary lib-more" data-action="sample">${icon('plus')}添加资产</button></div><div class="lib-filters">${segments(['全部资产','上传素材','生成结果'])}<button class="favorite" data-action="favorite" aria-pressed="false">${icon('star')}我的收藏</button><label class="lib-search">${icon('search')}<input aria-label="搜索资产" placeholder="搜索资产"></label>${btn('more','更多操作','sample','circle lib-more')}</div><div class="date-label date-wide">2026年10月31日 · 6 项</div><div class="asset-grid">${pics.map((p,i)=>`<button class="asset-card" data-action="light" data-image="${i}">${picture(p,'asset-image')}<div class="asset-title"><strong>${p.title}</strong><span>图片</span></div></button>`).join('')}</div></div></section>`}
function settings(){return `<section class="scrim" data-dismiss><div class="dialog settings glass-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title"><header class="dialog-head"><h2 id="settings-title">生成设置</h2>${btn('close','关闭','close','circle')}</header><div class="dialog-content"><div class="setting-group"><label class="label" for="model">模型</label><button id="model" class="field single row between" data-action="sample"><span>当前图像模型</span>${icon('down')}</button></div>${[['画质',['自动','低','中','高']],['尺寸',['自动','1K','2K','4K']],['比例',['1:1','3:4','4:3','16:9']],['数量',['1','2','3','4']]].map(([l,opts])=>`<div class="setting-group"><span class="label">${l}</span><div class="option-row">${opts.map((v,i)=>`<button class="option" data-select aria-pressed="${i===0}">${v}</button>`).join('')}</div></div>`).join('')}</div></div></section>`}
function picker(){return `<section class="scrim" data-dismiss><div class="dialog picker glass-panel" role="dialog" aria-modal="true" aria-labelledby="picker-title"><header class="dialog-head"><h2 id="picker-title">选择资产</h2>${btn('close','关闭','close','circle')}</header><div class="picker-filters">${segments(['全部资产','上传素材','生成结果'])}<button class="favorite" data-action="favorite" aria-pressed="false">${icon('star')}我的收藏</button></div><div class="picker-scroll"><p class="date-label">2026年10月31日 · 6 项</p><div class="picker-grid">${pics.map((p,i)=>`<div class="picker-tile"><button data-action="picker-preview" data-image="${i}" aria-label="预览 ${p.title}">${picture(p)}</button><button class="add-capsule" data-action="add">${icon('plus')}添加</button></div>`).join('')}</div><p class="picker-status">已显示全部资产</p></div></div></section>`}
function lightbox(kind){return `<section class="lightbox ${kind}" role="dialog" aria-modal="true" aria-label="${kind==='heavy'?'审读预览':'轻度预览'}" data-dismiss><header class="lb-top"><span class="counter">${previewIndexes.indexOf(imageIndex)+1} / ${previewIndexes.length}</span><div class="row">${kind==='heavy'?btn('star','收藏','favorite')+btn('download','下载','sample')+btn('folder','存入资产','sample'):''}${btn('close','关闭','close')}</div></header><div class="lb-picture" data-dismiss>${kind==='heavy'&&previewIndexes.length>1?btn('back','上一张','previous','circle glass arrow prev'):''}${picture(pics[imageIndex],'preview-image')}${kind==='heavy'&&previewIndexes.length>1?btn('next','下一张','next','circle glass arrow next'):''}</div><footer class="lb-bottom"><div class="gallery-viewport" ${previewIndexes.length<2?'hidden':''}><div class="gallery">${previewIndexes.map(i=>`<button class="thumb" data-thumb="${i}" aria-current="${i===imageIndex}" aria-label="查看第 ${i+1} 张">${picture(pics[i])}</button>`).join('')}</div></div><div class="tools-viewport"><div class="toolbar glass">${btn('flip','水平翻转','flip','circle')}${btn('flip','垂直翻转','flipY','circle')}${btn('rotate','向左旋转','rotateLeft','circle')}${btn('rotate','向右旋转','rotateRight','circle')}<span class="toolbar-sep"></span>${btn('minus','缩小','zoomOut','circle')}${btn('plus','放大','zoomIn','circle')}</div></div></footer></section>`}
function specimen(){return `<section class="specimen">${picture(pics[1],'specimen-bg')}<div class="specimen-scrim"></div><div class="specimen-stack"><span class="specimen-caption">相同图片背景 · ${material==='flat'?'旧稿材质':'修订材质'} · ${theme==='dark'?'深色':'浅色'}</span><div class="toolbar glass">${btn('star','收藏','favorite','circle')}${btn('download','下载','sample','circle')}<span class="toolbar-sep"></span><button data-action="sample">${icon('folder')}存入资产</button>${btn('close','关闭','sample','circle')}</div><div class="specimen-panel glass-panel"><h2>参考图</h2><p>透过表面看见暖色光影，文字保持清晰。较大的表单使用更实的底色，让内容稳定可读。</p><div class="stack"><input class="field single" aria-label="示例标题" value="光引 · 空间光影"><div class="option-row"><button class="option" aria-pressed="true" data-select>1:1</button><button class="option" data-select>3:4</button><button class="option" data-select>16:9</button></div><div class="specimen-buttons">${btn('plus','添加参考图','sample')}${btn('sliders','参数','sample')}<button class="action" data-action="sample">${icon('spark')}生成图片</button><button class="primary" data-action="sample">添加资产</button></div></div></div><div class="toolbar glass small"><span style="padding:6px 10px">玻璃只改变容器的材质，文字和图片不降透明度。</span></div></div></section>`}
function menu(){return `<nav class="nav-drop glass-panel" aria-label="当前页菜单"><button data-action="workbench">${icon('image')}图片创作</button><button data-action="library">${icon('folder')}内容库</button><div class="divider"></div>${['设置','语言','主题','修改密码','退出登录'].map(t=>`<button data-action="sample">${t}</button>`).join('')}</nav>`}
function render(){root.innerHTML=currentScene==='specimen'?specimen():`<div class="app"><div class="shell">${sidebar()}${topbar()}${base==='library'?library():workbench()}</div></div>${menuOpen?menu():''}${overlay==='settings'?settings():overlay==='picker'?picker():''}${pickerParent?picker():''}${overlay==='light'||overlay==='heavy'?lightbox(overlay):''}`;applyTransform();}
function applyTransform(){const img=document.querySelector('.preview-image');if(img)img.style.transform=`translate(${dragX}px,${dragY}px) rotate(${rotation}deg) scale(${zoom*flip},${zoom*flipVertical})`;}
function resetImage(){zoom=1;rotation=0;flip=1;flipVertical=1;dragX=dragY=0;}
function close(){if(pickerParent){pickerParent=false;overlay='picker';}else overlay=null;resetImage();render();}
let toastTimer,dragX=0,dragY=0,flipVertical=1,drag=null;
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast glass-panel';el.textContent=message;el.role='status';document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2200);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.hasAttribute('data-dismiss'))close();return;}if(b.hasAttribute('data-select')){b.parentElement.querySelectorAll('[data-select]').forEach(x=>x.setAttribute('aria-pressed',x===b));return;}if(b.dataset.thumb!==undefined){imageIndex=Number(b.dataset.thumb);resetImage();render();return;}const a=b.dataset.action;if(b.dataset.image!==undefined)imageIndex=Number(b.dataset.image);if(a==='close')return close();if(a==='settings'||a==='picker'||a==='light'||a==='heavy'){overlay=a;if(a==='heavy')previewIndexes=[0,1];if(a==='light')previewIndexes=base==='library'?pics.map((_,i)=>i):[imageIndex];resetImage();}else if(a==='picker-preview'){overlay='light';previewIndexes=pics.map((_,i)=>i);pickerParent=true;resetImage();}else if(a==='library'||a==='workbench'){base=a;overlay=null;historyOpen=false;menuOpen=false;}else if(a==='history')historyOpen=true;else if(a==='history-close')historyOpen=false;else if(a==='menu')menuOpen=!menuOpen;else if(a==='previous'||a==='next'){imageIndex=previewIndexes[(previewIndexes.indexOf(imageIndex)+(a==='next'?1:-1)+previewIndexes.length)%previewIndexes.length];resetImage();}else if(a==='add'){toast('设计演示：已选择这张参考图');return;}else if(a==='favorite'){const active=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',!active);b.style.color=active?'':'#b77b19';return;}else if(['flip','flipY','rotateLeft','rotateRight','zoomIn','zoomOut'].includes(a)){if(a==='flip')flip*=-1;if(a==='flipY')flipVertical*=-1;if(a==='rotateLeft')rotation-=90;if(a==='rotateRight')rotation+=90;if(a==='zoomIn')zoom=Math.min(3,zoom+.25);if(a==='zoomOut')zoom=Math.max(.5,zoom-.25);applyTransform();return;}else if(a==='sample'||a==='home'){toast('设计演示，不执行实际业务操作');return;}render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();menuOpen=false;render();}});
document.addEventListener('pointerdown',e=>{if(!e.target.matches('.preview-image')||zoom<=1)return;drag={x:e.clientX,y:e.clientY,ox:dragX,oy:dragY};e.target.setPointerCapture(e.pointerId);e.target.style.touchAction='none';e.preventDefault();});document.addEventListener('pointermove',e=>{if(!drag)return;dragX=drag.ox+e.clientX-drag.x;dragY=drag.oy+e.clientY-drag.y;applyTransform();});document.addEventListener('pointerup',()=>drag=null);document.addEventListener('pointercancel',()=>drag=null);render();
</script>
</body>
</html>
