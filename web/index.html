<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="热流即引，创作即闪耀" />
        <link rel="icon" href="/brand/hitflare-favicon-v3.ico" />
        <link rel="icon" type="image/png" sizes="32x32" href="/brand/hitflare-favicon-32-v3.png" />
        <link rel="apple-touch-icon" href="/brand/hitflare-apple-touch-icon-v3.png" />
        <title>光引 · HitFlare</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
